<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="1" stop-color="#0A0F22"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .f { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Courier New', monospace; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
      @keyframes pop  { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: none } }
      @keyframes dash { to { stroke-dashoffset: -24 } }
      @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
      @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      .r1 { opacity: 0; animation: rise .8s ease-out .1s forwards }
      .r2 { opacity: 0; animation: rise .8s ease-out .3s forwards }
      .r3 { opacity: 0; animation: rise .8s ease-out .5s forwards }
      .r4 { opacity: 0; animation: rise .8s ease-out .7s forwards }
      .r5 { opacity: 0; animation: rise .8s ease-out .9s forwards }
      .n  { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .6s ease-out forwards }
      .d1 { animation-delay: .6s } .d2 { animation-delay: .8s } .d3 { animation-delay: 1s }
      .d4 { animation-delay: 1.1s } .d5 { animation-delay: 1.2s } .d6 { animation-delay: 1.3s }
      .e  { fill: none; stroke: #8B5CF6; stroke-opacity: .45; stroke-width: 1.5; stroke-dasharray: 4 8; animation: dash 1.2s linear infinite }
      .dot { animation: pulse 1.8s ease-in-out infinite }
      .live { animation: breathe 2.4s ease-in-out infinite }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <circle cx="900" cy="210" r="330" fill="url(#glow)"/>

    <!-- ============ LEFT: identity ============ -->
    <g class="r1">
      <rect x="64" y="56" width="236" height="32" rx="16" fill="#A78BFA" fill-opacity="0.1" stroke="#A78BFA" stroke-opacity="0.35"/>
      <circle class="dot" cx="84" cy="72" r="4.5" fill="#A78BFA"/>
      <text x="98" y="77" class="f" font-size="13.5" fill="#DDD6FE" letter-spacing="0.4">Deep into System Design</text>
    </g>

    <text x="60" y="160" class="f r2" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="-2">Ahmed Samir</text>
    <text x="60" y="232" class="f r2" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="-2">Sakr<tspan fill="#8B5CF6">.</tspan></text>

    <text x="64" y="278" class="f r3" font-size="20" fill="#CBD5E1">I design systems — then I ship them.</text>

    <text x="64" y="316" class="m r4" font-size="14" fill="#64748B">
      <tspan fill="#A78BFA">.NET</tspan> · <tspan fill="#A78BFA">Node.js</tspan> · <tspan fill="#60A5FA">Angular</tspan> · <tspan fill="#60A5FA">React</tspan> · <tspan fill="#60A5FA">React Native</tspan>
    </text>

    <g class="r5 m" font-size="13">
      <rect x="64" y="340" width="122" height="28" rx="8" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-opacity="0.3"/>
      <text x="78" y="359" fill="#4ADE80">✓ unit tests</text>
      <rect x="196" y="340" width="168" height="28" rx="8" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-opacity="0.3"/>
      <text x="210" y="359" fill="#4ADE80">✓ integration tests</text>
    </g>

    <!-- ============ RIGHT: live architecture ============ -->
    <g class="r1 m" font-size="11" fill="#475569" letter-spacing="1.5">
      <text x="630" y="62">CLIENT</text>
      <text x="825" y="62">API LAYER</text>
      <text x="1020" y="62">SERVICES</text>
    </g>

    <!-- edges -->
    <path id="p1" class="e" d="M780 210 H825"/>
    <path id="p2" class="e" d="M975 200 C995 200 995 120 1020 120"/>
    <path id="p3" class="e" d="M975 210 H1020"/>
    <path id="p4" class="e" d="M975 220 C995 220 995 300 1020 300"/>
    <path id="p5" class="e" d="M900 238 V316"/>

    <!-- packets -->
    <g>
      <circle r="6" fill="#A78BFA" filter="url(#soft)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="3" fill="#EDE9FE"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>

      <circle r="6" fill="#4ADE80" filter="url(#soft)"><animateMotion dur="2.2s" begin=".3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="3" fill="#DCFCE7"><animateMotion dur="2.2s" begin=".3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>

      <circle r="6" fill="#60A5FA" filter="url(#soft)"><animateMotion dur="1.8s" begin=".8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="3" fill="#DBEAFE"><animateMotion dur="1.8s" begin=".8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>

      <circle r="6" fill="#C084FC" filter="url(#soft)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
      <circle r="3" fill="#F3E8FF"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>

      <circle r="6" fill="#22D3EE" filter="url(#soft)"><animateMotion dur="1.4s" begin=".5s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#p5"/></animateMotion></circle>
      <circle r="3" fill="#CFFAFE"><animateMotion dur="1.4s" begin=".5s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#p5"/></animateMotion></circle>
    </g>

    <!-- nodes -->
    <g class="f">
      <!-- client -->
      <g class="n d1">
        <rect x="630" y="178" width="150" height="64" rx="14" fill="#0F172A" stroke="#60A5FA" stroke-opacity="0.45"/>
        <text x="648" y="205" font-size="15" font-weight="700" fill="#F1F5F9">Web &amp; Mobile</text>
        <text x="648" y="226" font-size="10.5" fill="#94A3B8" class="m">Angular · React · RN</text>
      </g>
      <!-- api -->
      <g class="n d2">
        <rect x="825" y="182" width="150" height="56" rx="14" fill="#1E1B4B" stroke="#A78BFA" stroke-opacity="0.7"/>
        <rect class="live" x="825" y="182" width="150" height="56" rx="14" fill="none" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.5" filter="url(#soft)"/>
        <text x="843" y="206" font-size="15" font-weight="700" fill="#F5F3FF">API Gateway</text>
        <text x="843" y="225" font-size="11.5" fill="#C4B5FD" class="m">.NET · Node.js</text>
      </g>
      <!-- services -->
      <g class="n d3">
        <rect x="1020" y="96" width="140" height="48" rx="12" fill="#0F172A" stroke="#4ADE80" stroke-opacity="0.45"/>
        <circle cx="1038" cy="120" r="4" fill="#4ADE80"/>
        <text x="1050" y="125" font-size="14" font-weight="600" fill="#F1F5F9">Payments</text>
      </g>
      <g class="n d4">
        <rect x="1020" y="186" width="140" height="48" rx="12" fill="#0F172A" stroke="#60A5FA" stroke-opacity="0.45"/>
        <circle cx="1038" cy="210" r="4" fill="#60A5FA"/>
        <text x="1050" y="215" font-size="14" font-weight="600" fill="#F1F5F9">Equity</text>
      </g>
      <g class="n d5">
        <rect x="1020" y="276" width="140" height="48" rx="12" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.45"/>
        <circle cx="1038" cy="300" r="4" fill="#C084FC"/>
        <text x="1050" y="305" font-size="14" font-weight="600" fill="#F1F5F9">AI Engine</text>
      </g>
      <!-- data -->
      <g class="n d6">
        <rect x="835" y="316" width="130" height="48" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.45"/>
        <path d="M853 333c0-3 14-3 14 0v14c0 3-14 3-14 0z M853 333c0 3 14 3 14 0" stroke="#22D3EE" stroke-width="1.6" fill="none"/>
        <text x="876" y="345" font-size="13.5" font-weight="600" fill="#F1F5F9">SQL · Redis</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
