<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="1" stop-color="#0B1023"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
    <style>
      .f { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Courier New', monospace; }
      @keyframes drift1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,30px) } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-70px,-20px) } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes cycle {
        0%, 18% { opacity: 0; transform: translateY(10px) }
        3%, 15% { opacity: 1; transform: translateY(0) }
        100% { opacity: 0 }
      }
      .g1 { animation: drift1 14s ease-in-out infinite; }
      .g2 { animation: drift2 16s ease-in-out infinite; }
      .a1 { opacity: 0; animation: rise .8s ease-out .1s forwards; }
      .a2 { opacity: 0; animation: rise .8s ease-out .35s forwards; }
      .a3 { opacity: 0; animation: rise .8s ease-out .6s forwards; }
      .a4 { opacity: 0; animation: rise .8s ease-out .85s forwards; }
      .cur { animation: blink 1s step-end infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      .w { opacity: 0; animation: cycle 15s ease-in-out infinite; }
      .w1 { animation-delay: 0s } .w2 { animation-delay: 3s } .w3 { animation-delay: 6s }
      .w4 { animation-delay: 9s } .w5 { animation-delay: 12s }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="g1" cx="930" cy="90" r="260" fill="url(#glowA)"/>
    <circle class="g2" cx="1080" cy="330" r="240" fill="url(#glowB)"/>

    <!-- status pill -->
    <g class="a1">
      <rect x="72" y="62" width="250" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle class="dot" cx="94" cy="79" r="5" fill="#22C55E"/>
      <text x="110" y="84" class="f" font-size="14" fill="#CBD5E1" letter-spacing="0.5">Building in production</text>
    </g>

    <!-- name -->
    <text x="70" y="178" class="f a2" font-size="76" font-weight="800" fill="url(#txt)" letter-spacing="-2">Ahmed Samir Sakr</text>

    <!-- role -->
    <text x="74" y="222" class="f a3" font-size="22" fill="#94A3B8" letter-spacing="0.3">Full-Stack Software Engineer  ·  .NET  ·  Angular  ·  AI</text>

    <!-- rotating domains -->
    <g class="a4">
      <text x="74" y="290" class="m" font-size="20" fill="#64748B">&gt; building</text>
      <g class="m" font-size="20" font-weight="600" fill="#C4B5FD">
        <text class="w w1" x="200" y="290">FinTech platforms</text>
        <text class="w w2" x="200" y="290">Equity &amp; shareholder systems</text>
        <text class="w w3" x="200" y="290">Corporate governance tools</text>
        <text class="w w4" x="200" y="290">LegalTech solutions</text>
        <text class="w w5" x="200" y="290">AI-powered workflows</text>
      </g>
    </g>

    <!-- floating code card -->
    <g transform="translate(800 120)"><g class="a4">
      <rect width="330" height="170" rx="16" fill="#0F172A" fill-opacity="0.75" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="24" cy="24" r="5" fill="#F87171"/>
      <circle cx="42" cy="24" r="5" fill="#FBBF24"/>
      <circle cx="60" cy="24" r="5" fill="#34D399"/>
      <g class="m" font-size="14">
        <text x="24" y="66"><tspan fill="#C084FC">var</tspan><tspan fill="#E2E8F0"> result = </tspan><tspan fill="#C084FC">await</tspan></text>
        <text x="40" y="92"><tspan fill="#E2E8F0">mediator.</tspan><tspan fill="#60A5FA">Send</tspan><tspan fill="#E2E8F0">(</tspan></text>
        <text x="56" y="118"><tspan fill="#C084FC">new</tspan><tspan fill="#34D399"> ShipIt</tspan><tspan fill="#E2E8F0">());</tspan></text>
        <text x="24" y="148"><tspan fill="#64748B">// ✓ clean · tested · live</tspan></text>
      </g>
      <rect class="cur" x="146" y="105" width="9" height="17" fill="#C4B5FD"/>
    </g></g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
